name: econstruct weekday crm cycle

on:
  schedule:
    # Run TWICE on weekdays: 7 AM PT + 2 PM PT (UTC 14:00 + 21:00)
    # Double throughput: 200 campaign + 100 partner enrollments/day
    - cron: "0 14 * * 1-5"   # 7:00 AM Pacific
    - cron: "0 21 * * 1-5"   # 2:00 PM Pacific
  workflow_dispatch:

jobs:
  crm-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger weekday CRM agents
        shell: bash
        env:
          BASE_URL: ${{ secrets.ECONSTRUCT_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          BASE_URL="${BASE_URL:-https://econstructhomes.com}"
          if [[ -z "${CRON_SECRET:-}" ]]; then
            echo "CRON_SECRET secret is missing"
            exit 1
          fi

          auth_header=$(printf '%s%s%s' 'Authorization:' ' Bearer ' "$CRON_SECRET")

          post() {
            local path="$1"
            echo "==> POST ${path}"
            curl -fsS -X POST -H "$auth_header" "${BASE_URL}${path}" || echo "WARNING: ${path} returned non-zero (continuing)"
            echo
          }

          # Pipeline order: enrich → score → enroll → report
          # continue-on-error so one failed agent doesn't block the rest
          post /api/agents/score-leads
          post /api/agents/email-enrich
          post /api/agents/assessor-enrich
          post /api/agents/apollo-enrich
          post /api/agents/partner-enroll
          post /api/agents/campaign-enroll
          post /api/agents/event-sync
          post /api/agents/daily-report
